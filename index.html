              "https://fonts.googleapis.com/css2?" + set.css + "&display=swap";
            document.head.appendChild(k);
          }
          var out = "";
          try {
            for (var i = 0; i < document.styleSheets.length; i++) {
              var rules;
              try {
                rules = document.styleSheets[i].cssRules;
              } catch (e) {
                continue;
              }
              for (var j = 0; j < rules.length; j++) {
                var r = rules[j];
                if (!r.style || !r.selectorText) continue;
                var f =
                  r.style.getPropertyValue("--framer-font-family") ||
                  r.style.getPropertyValue("font-family");
                if (!f) continue;
                var fam = /Cormorant/.test(f)
                  ? set.serif
                  : /Manrope/.test(f)
                    ? set.sans
                    : null;
                if (!fam) continue;
                var sel = r.selectorText
                  .split(",")
                  .map(function (s) {
                    return (
                      'html[lang|="' +
                      (l === "zh" ? "zh" : "ar") +
                      '"] ' +
                      s.trim()
                    );
                  })
                  .join(",");
                out +=
                  sel +
                  "{--framer-font-family:" +
                  fam +
                  " !important;font-family:" +
                  fam +
                  " !important;" +
                  (set.italic
                    ? ""
                    : "--framer-font-style:normal !important;font-style:normal !important;") +
                  (fam === set.serif && l === "ar"
                    ? "--framer-font-weight:400 !important;"
                    : "") +
                  "}\n";
              }
            }
          } catch (e) {}
          var st = document.createElement("style");
          st.id = "ombrine-locale-fonts";
          st.textContent = out;
          document.head.appendChild(st);
        }
        build();
        try {
          new MutationObserver(build).observe(document.documentElement, {
            attributes: true,
            attributeFilter: ["lang"],
          });
        } catch (e) {}
        window.addEventListener("load", build);
      })();
    </script>
    <!-- Ombrine · Light / Nuit. Copies the colour styles' dark values into rules keyed on html[data-ombrine-theme]. -->
    <script>
      (function () {
        if (document.getElementById("ombrine-theme-css")) return;
        var light = "",
          dark = "";
        function visit(rules, inDark, inLight) {
          for (var i = 0; i < rules.length; i++) {
            var r = rules[i];
            if (r.media && r.cssRules) {
              var m = String(r.media.mediaText || "");
              visit(
                r.cssRules,
                inDark || /prefers-color-scheme:\s*dark/.test(m),
                inLight || /prefers-color-scheme:\s*light/.test(m),
              );
            } else if (r.style) {
              var d = "";
              for (var j = 0; j < r.style.length; j++) {
                var n = r.style[j];
                if (n && n.indexOf("--token-") === 0)
                  d += n + ":" + r.style.getPropertyValue(n) + ";";
              }
              if (d) {
                if (inDark) dark += d;
                else if (!inLight) light += d;
              }
            }
          }
        }
        try {
          for (var s = 0; s < document.styleSheets.length; s++) {
            try {
              visit(document.styleSheets[s].cssRules, false, false);
            } catch (e) {}
          }
        } catch (e) {}
        if (!dark) return;
        var el = document.createElement("style");
        el.id = "ombrine-theme-css";
        el.textContent =
          'html[data-ombrine-theme="dark"] body{' +
          dark +
          '} html[data-ombrine-theme="light"] body{' +
          light +
          "} html{transition:background-color .6s}";
        document.head.appendChild(el);
        try {
          document.body.setAttribute(
            "data-framer-theme",
            document.documentElement.getAttribute("data-ombrine-theme") ||
              "light",
          );
        } catch (e) {}
      })();
    </script>
